---
stalwart_hostname: "{{ inventory_hostname }}"
stalwart_admin_password: "{{ vault_stalwart_admin_password }}"

# Let's Encrypt via tls-alpn-01 on 443 (the NSG leaves 443 open).
stalwart_tls_mode: acme
stalwart_acme_contact: "{{ acme_contact }}"
stalwart_acme_domains:
  - "{{ inventory_hostname }}"

stalwart_storage_backend: rocksdb
stalwart_cli_install: true

# All mail lives on the attached Azure managed data disk, not the OS disk.
# The mailbox playbook formats and mounts the disk at this path before the
# role runs; the role's systemd unit already lists stalwart_data_dir in
# ReadWritePaths, so pointing it at the mount is supported.
stalwart_data_mount: /var/lib/stalwart
stalwart_data_dir: "{{ stalwart_data_mount }}"

# The NSG already restricts inbound; the host firewall stays off to
# avoid double management. Flip on if you prefer defense in depth.
stalwart_manage_firewall: false

# Raw TOML appended verbatim to the Stalwart configuration. Deliberately
# left as comments only: the stanza and keys that mark the MX edges as
# trusted inbound relays differ between Stalwart versions, and guessing
# them here would ship a config that either fails to parse or silently
# does nothing. Verify the relay/trust settings against the Stalwart docs
# for the version actually installed — this is best configured in the
# Stalwart web admin UI, then mirrored here once the syntax is confirmed.
#
# The MX edge private IPs to allow-list are available in the inventory as
# hostvars[<mx host>].private_ip for each host in groups['mx_edges'].
stalwart_extra_config: |
  # PLACEHOLDER — no extra configuration is applied.
  #
  # TODO: allow-list the MX edge private IPs as trusted inbound relays,
  # using the stanza documented for the installed Stalwart version.
