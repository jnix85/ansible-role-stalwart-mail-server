---
- name: Assert supported platform
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
      - ansible_service_mgr == 'systemd'
      - ansible_architecture in stalwart_arch_map
    fail_msg: >-
      This role supports systemd-based Debian/RedHat family hosts on
      {{ stalwart_arch_map.keys() | join('/') }} only
      (got {{ ansible_os_family }}/{{ ansible_service_mgr }}/{{ ansible_architecture }}).

- name: Assert admin password is provided
  ansible.builtin.assert:
    that:
      - stalwart_admin_password is defined
      - stalwart_admin_password | length >= 12
    fail_msg: >-
      stalwart_admin_password must be set (>= 12 characters).
      Supply it via Ansible Vault. Stalwart 0.16 takes the bootstrap
      admin credential as an environment variable, so it is written to
      the host in plain text in a 0640 file owned by root.
    quiet: true
