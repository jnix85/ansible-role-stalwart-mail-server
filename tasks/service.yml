---
# Written before the unit so the service never starts without the
# bootstrap environment it references.
- name: Install bootstrap environment file
  ansible.builtin.template:
    src: stalwart.env.j2
    dest: "{{ stalwart_env_file }}"
    owner: root
    group: "{{ stalwart_group }}"
    mode: "0640"
  no_log: true
  notify: Restart stalwart

- name: Install systemd unit
  ansible.builtin.template:
    src: stalwart.service.j2
    dest: "/etc/systemd/system/{{ stalwart_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart stalwart

- name: Enable and start Stalwart service
  ansible.builtin.systemd_service:
    name: "{{ stalwart_service_name }}"
    enabled: "{{ stalwart_service_enabled }}"
    state: "{{ stalwart_service_state }}"
    daemon_reload: true
