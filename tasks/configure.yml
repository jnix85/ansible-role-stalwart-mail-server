---
# Stalwart 0.16 reads only a data store descriptor from --config: a JSON
# document naming the store and how to reach it. Listeners, TLS,
# domains and accounts all live inside the store and are managed from
# the web admin, so there is nothing else to template here.
- name: Assert the storage backend is supported
  ansible.builtin.assert:
    that:
      - stalwart_storage_backend in stalwart_store_types
    fail_msg: >-
      stalwart_storage_backend must be one of:
      {{ stalwart_store_types.keys() | join(', ') }}.

# Built as a mapping and serialized with to_nice_json so the output is
# valid JSON by construction rather than by careful quoting.
- name: Build the data store descriptor
  ansible.builtin.set_fact:
    stalwart_store_descriptor_effective: >-
      {{ stalwart_store_descriptor
         if stalwart_store_descriptor
         else (stalwart_store_descriptor_file_backed
               if stalwart_storage_backend in ['rocksdb', 'sqlite']
               else stalwart_store_descriptor_sql) }}
  vars:
    stalwart_store_descriptor_file_backed:
      "@type": "{{ stalwart_store_types[stalwart_storage_backend] }}"
      path: "{{ stalwart_data_dir }}"
    stalwart_store_descriptor_sql:
      "@type": "{{ stalwart_store_types[stalwart_storage_backend] }}"
      host: "{{ stalwart_db_host }}"
      port: "{{ stalwart_db_port | int }}"
      database: "{{ stalwart_db_name }}"
      user: "{{ stalwart_db_user }}"
      password: "{{ stalwart_db_password }}"
  no_log: "{{ stalwart_db_password | length > 0 }}"

- name: Write the data store descriptor
  ansible.builtin.copy:
    content: "{{ stalwart_store_descriptor_effective | to_nice_json }}\n"
    dest: "{{ stalwart_config_file }}"
    owner: root
    group: "{{ stalwart_group }}"
    mode: "0640"
  no_log: "{{ stalwart_db_password | length > 0 }}"
  notify: Restart stalwart
