---
- name: Validate role configuration
  ansible.builtin.import_tasks: preflight.yml
  tags: [stalwart, stalwart_preflight]

- name: Load OS family specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags: [stalwart, always]

- name: Install Stalwart
  ansible.builtin.import_tasks: install.yml
  tags: [stalwart, stalwart_install]

- name: Install stalwart-cli
  ansible.builtin.import_tasks: cli.yml
  when: stalwart_cli_install | bool
  tags: [stalwart, stalwart_cli]

- name: Configure Stalwart
  ansible.builtin.import_tasks: configure.yml
  tags: [stalwart, stalwart_configure]

- name: Manage systemd service
  ansible.builtin.import_tasks: service.yml
  tags: [stalwart, stalwart_service]

- name: Manage firewall rules
  ansible.builtin.import_tasks: firewall.yml
  when: stalwart_manage_firewall | bool
  tags: [stalwart, stalwart_firewall]

- name: Run post-install smoke test
  ansible.builtin.import_tasks: smoke.yml
  when:
    - stalwart_smoke_test | bool
    - stalwart_service_state == 'started'
  tags: [stalwart, stalwart_smoke]
