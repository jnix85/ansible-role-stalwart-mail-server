---
- name: Install firewall packages
  ansible.builtin.package:
    name: "{{ stalwart_firewall_packages }}"
    state: present

- name: Allow Stalwart ports (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: "Stalwart mail server"
  loop: "{{ stalwart_expected_ports }}"
  when: ansible_os_family == 'Debian'

# The role never starts or enables firewalld (see README); rules are
# applied immediately only when it is already running, and are written
# permanent-only otherwise so they take effect if it is ever started.
- name: Gather service facts
  ansible.builtin.service_facts:
  when: ansible_os_family == 'RedHat'

- name: Set firewalld running fact
  ansible.builtin.set_fact:
    stalwart_firewalld_running: >-
      {{ ansible_facts.services['firewalld.service'].state | default('') == 'running' }}
  when: ansible_os_family == 'RedHat'

- name: Allow Stalwart ports (firewalld)
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: "{{ stalwart_firewalld_running }}"
    state: enabled
  loop: "{{ stalwart_expected_ports }}"
  when: ansible_os_family == 'RedHat'
