---
# ------------------------------------------------------------------
# Version / download
# ------------------------------------------------------------------

# Stalwart release to install (git tag without the leading "v").
stalwart_version: "0.16.9"

# GitHub repository releases are downloaded from.
stalwart_github_repo: stalwartlabs/stalwart

# Map ansible_architecture to the release target triple architecture.
stalwart_arch_map:
  x86_64: x86_64
  aarch64: aarch64

# libc flavour of the release binary: gnu or musl.
stalwart_libc: gnu

# Candidate download URLs, probed in order at install time; the first
# one that responds is used. Upstream renamed its release assets from
# stalwart-mail-* to stalwart-* over time, so both are covered. The
# stalwart-* form is verified present for 0.16.9 on x86_64 and aarch64.
stalwart_download_urls:
  - >-
    https://github.com/{{ stalwart_github_repo }}/releases/download/v{{ stalwart_version }}/stalwart-{{
    stalwart_arch_map[ansible_architecture] | default(ansible_architecture) }}-unknown-linux-{{ stalwart_libc }}.tar.gz
  - >-
    https://github.com/{{ stalwart_github_repo }}/releases/download/v{{ stalwart_version }}/stalwart-mail-{{
    stalwart_arch_map[ansible_architecture] | default(ansible_architecture) }}-unknown-linux-{{ stalwart_libc }}.tar.gz

# Explicit URL override (internal mirror, exotic asset name). When set,
# it is used directly and the candidate list above is ignored.
stalwart_download_url: ""

# Install a separate stalwart-cli binary. Upstream publishes no such
# asset for 0.16.x (the server binary carries the admin commands), so
# enabling this also requires stalwart_cli_download_url.
stalwart_cli_install: false
stalwart_cli_download_urls:
  - >-
    https://github.com/{{ stalwart_github_repo }}/releases/download/v{{ stalwart_version }}/stalwart-cli-{{
    stalwart_arch_map[ansible_architecture] | default(ansible_architecture) }}-unknown-linux-{{ stalwart_libc }}.tar.gz
stalwart_cli_download_url: ""

# Optional checksum for the downloaded tarball, e.g. "sha256:abcd...".
stalwart_download_checksum: ""

# ------------------------------------------------------------------
# Install layout / service
# ------------------------------------------------------------------

stalwart_install_dir: /opt/stalwart
stalwart_user: stalwart
stalwart_group: stalwart
stalwart_service_name: stalwart
stalwart_service_enabled: true
stalwart_service_state: started

# The file passed to `stalwart --config`. In 0.16 this is a JSON data
# store descriptor, not a general configuration file: it tells the
# server only how to reach its store. Everything else lives inside the
# store and is managed from the web admin.
stalwart_config_file: "{{ stalwart_install_dir }}/etc/config.json"

# ------------------------------------------------------------------
# Identity
# ------------------------------------------------------------------

# Fully qualified hostname the server identifies as (EHLO, certs, ...).
stalwart_hostname: "{{ ansible_fqdn }}"

# Base URL the web admin and generated links use.
stalwart_public_url: "https://{{ stalwart_hostname }}"

# ------------------------------------------------------------------
# Administrator bootstrap (REQUIRED)
# ------------------------------------------------------------------

# REQUIRED: supply via Ansible Vault. The role fails fast when unset.
# Passed to the service as STALWART_RECOVERY_ADMIN, which Stalwart uses
# to create a temporary "recovery-admin" account for first login.
stalwart_admin_password: ""

# ------------------------------------------------------------------
# Storage
# ------------------------------------------------------------------

# One of the keys in stalwart_store_types below.
stalwart_storage_backend: rocksdb

# Maps the friendly name to the "@type" discriminator the server
# expects. 0.16.9 also names a FoundationDb variant, but the official
# builds are not compiled with it, so it is deliberately absent here.
stalwart_store_types:
  rocksdb: RocksDb
  sqlite: Sqlite
  postgresql: PostgreSql
  mysql: MySql

# Mail store location for the file-backed backends.
stalwart_data_dir: "{{ stalwart_install_dir }}/data"

# Settings for the SQL backends (the role does NOT install a database).
# Only rocksdb and sqlite are verified against the 0.16.9 binary; the
# SQL field names below are best-effort. The server ignores unknown
# fields rather than rejecting them, so a wrong name fails as a
# connection error at startup. Use stalwart_store_descriptor to write
# an exact descriptor of your own if you hit that.
stalwart_db_host: localhost
stalwart_db_port: 5432
stalwart_db_name: stalwart
stalwart_db_user: stalwart
stalwart_db_password: ""

# ------------------------------------------------------------------
# Listeners
# ------------------------------------------------------------------
#
# Stalwart 0.16 does not take listener configuration from a file: the
# ports below are the ones a freshly bootstrapped server binds, and the
# role uses them only to open the firewall and to verify the service is
# healthy. Change the listeners in the web admin, then update this list
# to match.
stalwart_expected_ports:
  - 25    # SMTP
  - 443   # HTTPS: JMAP, API, web admin
  - 465   # submissions (implicit TLS)
  - 993   # IMAPS
  - 995   # POP3S
  - 4190  # ManageSieve
  - 8080  # plain HTTP

# Port the smoke test's health check uses. Must be one of the above.
stalwart_https_port: 443

# ------------------------------------------------------------------
# Firewall (opt-in)
# ------------------------------------------------------------------

# The role never enables or activates a firewall itself, to avoid
# locking you out of the host.
stalwart_manage_firewall: false

# ------------------------------------------------------------------
# Post-install smoke test
# ------------------------------------------------------------------

# Verifies the service is running, the expected ports accept
# connections, and /healthz/live returns 200. This is what catches a
# server that starts and then exits.
stalwart_smoke_test: true

# Address the smoke test connects to.
stalwart_smoke_test_host: 127.0.0.1

# Escape hatch: when set, this mapping is written verbatim as the data
# store descriptor and the settings above are ignored. Use it for a
# backend or field name the role does not model.
stalwart_store_descriptor: {}

# Bootstrap environment file read by the systemd unit. Holds the
# admin password, so it is written 0640 root:{{ stalwart_group }}.
stalwart_env_file: "{{ stalwart_install_dir }}/etc/stalwart.env"
