---
version: 2.1

# Shared setup, so the diagnostic jobs below run byte-identical steps to
# the real molecule job and cannot drift from it.
commands:
  setup_python:
    steps:
      - run:
          name: Install test dependencies
          # A venv sidesteps PEP 668 (externally-managed system Python).
          command: |
            python3 -m venv ~/venv
            ~/venv/bin/pip install --upgrade pip
            ~/venv/bin/pip install ansible-core molecule 'molecule-plugins[docker]' docker
            echo 'export PATH="$HOME/venv/bin:$PATH"' >> "$BASH_ENV"
  install_collections:
    steps:
      - run:
          name: Install collection dependencies
          command: ansible-galaxy collection install -r requirements.yml

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    # Molecule playbooks reference the role by its Galaxy name, so the
    # project is checked out under that directory name.
    working_directory: ~/jnix85.stalwart_mail_server
    steps:
      - checkout
      - run:
          name: Install lint dependencies
          command: pip install ansible-core ansible-lint yamllint
      - run:
          name: Install collection dependencies
          command: ansible-galaxy collection install -r requirements.yml
      - run:
          name: Run yamllint
          command: yamllint .
      - run:
          name: Run ansible-lint
          command: ansible-lint

  molecule:
    parameters:
      distro:
        type: string
    # Molecule's docker driver needs privileged systemd containers,
    # which requires a full VM rather than a docker executor.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/jnix85.stalwart_mail_server
    environment:
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
      MOLECULE_DISTRO: << parameters.distro >>
    steps:
      - checkout
      - setup_python
      - install_collections
      - run:
          name: Run Molecule tests
          command: molecule test

  # TEMPORARY diagnostics. The molecule matrix fails identically on every
  # distro and this environment cannot reach circleci.com to read job
  # logs, so these jobs stage the pipeline and let the pass/fail pattern
  # of their commit statuses localize the failure. Delete once the cause
  # is known.
  diag:
    parameters:
      stage:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/jnix85.stalwart_mail_server
    environment:
      MOLECULE_DISTRO: debian13
    steps:
      - checkout
      - setup_python
      - install_collections
      - run:
          name: Molecule create
          command: molecule create
      - run:
          name: Converge everything except the smoke test
          # Rounds one and two narrowed this to: the role's tasks all
          # succeed, systemd accepts the unit, but the daemon is dead
          # moments later. Skipping smoke keeps converge green so the
          # probes below decide the job's outcome.
          command: |
            molecule converge -- --tags \
              stalwart_preflight,stalwart_install,stalwart_tls,stalwart_configure,stalwart_service
      - run:
          name: Collect service state and journal
          # Printed in full so a human reading CircleCI sees the real
          # error directly. The grep below turns one error class into
          # this job's exit status, which is the only signal readable
          # from the sandbox that cannot reach circleci.com.
          command: |
            CID=$(docker ps -q --filter name=stalwart-instance | head -1)
            echo "container: $CID"
            docker exec "$CID" systemctl status stalwart --no-pager -l > /tmp/diag.txt 2>&1 || true
            docker exec "$CID" journalctl -u stalwart --no-pager -n 200 >> /tmp/diag.txt 2>&1 || true
            docker exec "$CID" sh -c 'cat /opt/stalwart/etc/config.toml' >> /tmp/diag.txt 2>&1 || true
            echo "===== BEGIN DIAGNOSTIC ====="
            cat /tmp/diag.txt
            echo "===== END DIAGNOSTIC ====="
      - run:
          name: Probe for this stage's error class
          # Green means the pattern was found in the journal.
          command: |
            case "<< parameters.stage >>" in
              config) PAT='config|toml|parse|invalid|unknown field|missing field|deserial' ;;
              perm)   PAT='permission denied|eacces|not permitted|read-only file system' ;;
              bind)   PAT='address already in use|cannot assign|failed to bind|eaddr|permission.*bind' ;;
              *)      PAT='panic|fatal|error' ;;
            esac
            echo "probing for: $PAT"
            grep -qiE "$PAT" /tmp/diag.txt
      - run:
          name: Molecule destroy
          command: molecule destroy || true
          when: always

workflows:
  ci:
    jobs:
      - lint
      - molecule:
          requires:
            - lint
          matrix:
            parameters:
              distro:
                - debian13
                - ubuntu2404
                - ubuntu2604
      # TEMPORARY: see the diag job. Each stage reports its own commit
      # status, so the first stage that goes red is the failing step.
      - diag:
          name: diag-<< matrix.stage >>
          requires:
            - lint
          matrix:
            parameters:
              stage:
                - config
                - perm
                - bind
                - any
