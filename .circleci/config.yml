---
version: 2.1

# Shared setup, so the diagnostic jobs below run byte-identical steps to
# the real molecule job and cannot drift from it.
commands:
  setup_python:
    steps:
      - run:
          name: Install test dependencies
          # A venv sidesteps PEP 668 (externally-managed system Python).
          command: |
            python3 -m venv ~/venv
            ~/venv/bin/pip install --upgrade pip
            ~/venv/bin/pip install ansible-core molecule 'molecule-plugins[docker]' docker
            echo 'export PATH="$HOME/venv/bin:$PATH"' >> "$BASH_ENV"
  install_collections:
    steps:
      - run:
          name: Install collection dependencies
          command: ansible-galaxy collection install -r requirements.yml

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    # Molecule playbooks reference the role by its Galaxy name, so the
    # project is checked out under that directory name.
    working_directory: ~/jnix85.stalwart_mail_server
    steps:
      - checkout
      - run:
          name: Install lint dependencies
          command: pip install ansible-core ansible-lint yamllint
      - run:
          name: Install collection dependencies
          command: ansible-galaxy collection install -r requirements.yml
      - run:
          name: Run yamllint
          command: yamllint .
      - run:
          name: Run ansible-lint
          command: ansible-lint

  molecule:
    parameters:
      distro:
        type: string
    # Molecule's docker driver needs privileged systemd containers,
    # which requires a full VM rather than a docker executor.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/jnix85.stalwart_mail_server
    environment:
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
      MOLECULE_DISTRO: << parameters.distro >>
    steps:
      - checkout
      - setup_python
      - install_collections
      - run:
          name: Run Molecule tests
          command: molecule test

  # TEMPORARY diagnostics. The molecule matrix fails identically on every
  # distro and this environment cannot reach circleci.com to read job
  # logs, so these jobs stage the pipeline and let the pass/fail pattern
  # of their commit statuses localize the failure. Delete once the cause
  # is known.
  diag:
    parameters:
      stage:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/jnix85.stalwart_mail_server
    environment:
      MOLECULE_DISTRO: debian13
    steps:
      - checkout
      - setup_python
      - install_collections
      - run:
          name: Molecule create
          command: molecule create
      - run:
          name: Converge up to the stage under test
          # Round one proved setup, collections and create all pass and
          # that a full converge fails, so this splits converge by role
          # phase. include_vars carries the "always" tag, so it still
          # runs under every --tags subset.
          command: |
            BASE=stalwart_preflight,stalwart_install
            CONF=$BASE,stalwart_tls,stalwart_configure
            case "<< parameters.stage >>" in
              install) TAGS=$BASE ;;
              config)  TAGS=$CONF ;;
              *)       TAGS=$CONF,stalwart_service ;;
            esac
            echo "converging with tags: $TAGS"
            molecule converge -- --tags "$TAGS"
      - when:
          condition:
            equal: ["<< parameters.stage >>", "active"]
          steps:
            - run:
                name: Assert the service actually started
                # Distinguishes "the role's tasks succeed but the daemon
                # never runs" from "the daemon runs and only the smoke
                # test's probes fail".
                command: |
                  docker ps -a
                  CID=$(docker ps -q --filter name=stalwart-instance | head -1)
                  docker exec "$CID" systemctl is-active stalwart
      - run:
          name: Molecule destroy
          command: molecule destroy || true
          when: always

workflows:
  ci:
    jobs:
      - lint
      - molecule:
          requires:
            - lint
          matrix:
            parameters:
              distro:
                - debian13
                - ubuntu2404
                - ubuntu2604
      # TEMPORARY: see the diag job. Each stage reports its own commit
      # status, so the first stage that goes red is the failing step.
      - diag:
          name: diag-<< matrix.stage >>
          requires:
            - lint
          matrix:
            parameters:
              stage:
                - install
                - config
                - service
                - active
