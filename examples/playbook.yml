---
# Example: deploy Stalwart with Let's Encrypt (ACME) TLS.
#
# 1. Install the role (from this git repository):
#      ansible-galaxy role install \
#        git+https://github.com/jnix85/ansible-role-stalwart-mail-server.git,main,jnix85.stalwart_mail_server
#
# 2. Create an encrypted vault for the admin password:
#      ansible-vault create vault.yml
#    and add:
#      vault_stalwart_admin_password: "a-long-random-password"
#
# 3. Adjust inventory.yml, then run:
#      ansible-playbook -i inventory.yml playbook.yml --ask-vault-pass
#
# For a quick lab run without DNS or a public IP, switch
# stalwart_tls_mode to "selfsigned" and drop the acme_* vars.
- name: Deploy Stalwart mail server
  hosts: mailservers
  become: true
  vars_files:
    - vault.yml
  roles:
    - role: jnix85.stalwart_mail_server
      vars:
        stalwart_hostname: mail.example.com
        stalwart_admin_password: "{{ vault_stalwart_admin_password }}"
        stalwart_tls_mode: acme
        stalwart_acme_contact: postmaster@example.com
        stalwart_acme_domains:
          - mail.example.com
        stalwart_manage_firewall: true
