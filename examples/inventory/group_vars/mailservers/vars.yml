---
# Stalwart configuration for the mailservers group.
# Secrets live in vault.yml (encrypted) next to this file.

# The FQDN the server identifies as (EHLO, certificates, web admin).
stalwart_hostname: "{{ inventory_hostname }}"
stalwart_public_url: "https://{{ inventory_hostname }}"

# From vault.yml — never put the real password here. Stalwart takes the
# bootstrap admin credential from the environment, so this lands on the
# host in plain text in a 0640 root-owned file.
stalwart_admin_password: "{{ vault_stalwart_admin_password }}"

# --- Storage -------------------------------------------------------
# rocksdb (default, embedded) | sqlite | postgresql | mysql
stalwart_storage_backend: rocksdb
# Point this at a dedicated disk for anything beyond a lab.
# stalwart_data_dir: /var/lib/stalwart

# --- Extras --------------------------------------------------------
# Open the ports Stalwart binds (never activates the firewall itself).
stalwart_manage_firewall: true

# TLS, domains, accounts and listeners are configured in the web admin
# at https://<host>/ after the first run — Stalwart 0.16 keeps them in
# its data store rather than in a configuration file.
