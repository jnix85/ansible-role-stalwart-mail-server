---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly run to catch upstream/download breakage.
    - cron: "30 5 * * 1"

defaults:
  run:
    working-directory: jnix85.stalwart_mail_server

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
        with:
          path: jnix85.stalwart_mail_server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip3 install ansible-core ansible-lint yamllint

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - rockylinux9
          - ubuntu2404
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
        with:
          path: jnix85.stalwart_mail_server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip3 install ansible-core molecule molecule-plugins[docker] docker

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule tests
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
