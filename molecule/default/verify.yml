---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert stalwart service is running and enabled
      ansible.builtin.assert:
        that:
          - "'stalwart.service' in ansible_facts.services"
          - ansible_facts.services['stalwart.service'].state == 'running'
          - ansible_facts.services['stalwart.service'].status == 'enabled'

    - name: Wait for SMTP listener
      ansible.builtin.wait_for:
        port: 25
        host: 127.0.0.1
        timeout: 60

    - name: Wait for IMAP listener
      ansible.builtin.wait_for:
        port: 143
        host: 127.0.0.1
        timeout: 30

    - name: Check HTTPS health endpoint
      ansible.builtin.uri:
        url: https://127.0.0.1:443/healthz/live
        validate_certs: false
        status_code: 200
      register: health_result
      retries: 5
      delay: 5
      until: health_result.status == 200

    - name: Check installed binary version
      ansible.builtin.command: /opt/stalwart/bin/stalwart --version
      register: version_result
      changed_when: false

    - name: Assert expected version is installed
      ansible.builtin.assert:
        that:
          - "'0.16.9' in version_result.stdout"
