---
- name: Verify
  hosts: all
  become: true
  vars_files:
    # Assert against the role's own defaults instead of duplicating them.
    - ../../defaults/main.yml
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert stalwart service is running and enabled
      ansible.builtin.assert:
        that:
          - "'stalwart.service' in ansible_facts.services"
          - ansible_facts.services['stalwart.service'].state == 'running'
          - ansible_facts.services['stalwart.service'].status == 'enabled'

    - name: Wait for the expected listeners
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        timeout: 60
      loop: "{{ stalwart_expected_ports }}"

    - name: Check HTTPS health endpoint
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ stalwart_https_port }}/healthz/live"
        validate_certs: false
        status_code: 200
      register: health_result
      retries: 5
      delay: 5
      until: health_result.status == 200

    - name: Read the data store descriptor
      ansible.builtin.slurp:
        src: "{{ stalwart_config_file }}"
      register: stalwart_descriptor_raw

    - name: Assert the descriptor names the configured backend
      ansible.builtin.assert:
        that:
          - (stalwart_descriptor_raw.content | b64decode | from_json)['@type']
            == stalwart_store_types[stalwart_storage_backend]

    - name: Check installed binary version
      ansible.builtin.command: "{{ stalwart_install_dir }}/bin/stalwart --version"
      register: version_result
      changed_when: false

    - name: Assert expected version is installed
      ansible.builtin.assert:
        that:
          - stalwart_version in version_result.stdout
